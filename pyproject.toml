[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickselect"
version = "1.0.0"
description = "A behavioural clone of Photoshop's Quick Selection Tool, built on published graph-cut research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.7",
    "PyMaxflow>=1.3.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.5"]

[project.scripts]
quickselect = "quickselect.ui.app:main"
quickselect-diff = "quickselect.cli:main"
quickselect-compare = "quickselect.ui.viewer:main"

[tool.setuptools.packages.find]
include = ["quickselect*"]
